name: Contract Alert

on:
  schedule:
    # Runs every hour at :00
    - cron: "0 * * * *"
  # Allows manual trigger from GitHub Actions UI for testing
  workflow_dispatch:

jobs:
  alert:
    runs-on: ubuntu-latest

    permissions:
      contents: write  # needed to commit seen_ids.json back

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run alert script
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
        run: python main.py

      - name: Commit updated seen_ids.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_ids.json
          # Only commit if there are actual changes
          git diff --cached --quiet || git commit -m "chore: update seen_ids [skip ci]"
          git push
